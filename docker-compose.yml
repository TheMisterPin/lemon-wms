services:
  db:
    image: postgres:16-alpine
    container_name: lemon-wms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d wms_db']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lemon-wms-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wms_db
      JWT_SECRET: docker-dev-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: >
      sh -c "pnpm install --frozen-lockfile &&
      pnpm prisma generate &&
      pnpm prisma db push &&
      pnpm seed:all &&
      pnpm dev --hostname 0.0.0.0 --port 3000"

volumes:
  postgres_data:
  app_node_modules:
